[package]
name = "dbr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dbr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3.25.0"
tokio-test = "0.4"
